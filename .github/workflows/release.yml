name: Publish manhuntK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish Latest Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: manhuntK-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true

      # Delete older releases so only the single latest version exists
      - name: Delete older releases (Keep only latest)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
